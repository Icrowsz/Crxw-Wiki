<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki do Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* ===== CORES: mude aqui ===== */
:root{
  --azul:#0a4dff;
  --azul-claro:#3fd0ff;
  --azul-escuro:#06237a;
  --preto:#0b0b10;
  --branco:#f7f7f2;
  --titulo:'Bangers',Impact,'Arial Black',sans-serif;
  --tag:'Permanent Marker','Comic Sans MS',cursive;
  --texto:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:500 19px/1.4 var(--texto);color:var(--branco);min-height:100vh;overflow-x:hidden;
  background-color:var(--preto);
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' fill='none' stroke='%23262633' stroke-width='5'><polygon points='80.0,-4.0 102.2,49.4 159.9,54.0 115.9,91.7 129.4,148.0 80.0,117.8 30.6,148.0 44.1,91.7 0.1,54.0 57.8,49.4'/><polygon points='80.0,18.0 96.4,57.4 139.0,60.8 106.5,88.6 116.4,130.2 80.0,107.9 43.6,130.2 53.5,88.6 21.0,60.8 63.6,57.4'/><polygon points='80.0,40.0 90.6,65.4 118.0,67.6 97.1,85.6 103.5,112.4 80.0,98.0 56.5,112.4 62.9,85.6 42.0,67.6 69.4,65.4'/><polygon points='80.0,62.0 84.8,73.4 97.1,74.4 87.7,82.5 90.6,94.6 80.0,88.1 69.4,94.6 72.3,82.5 62.9,74.4 75.2,73.4'/></svg>");
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--azul-claro);outline-offset:3px}

/* Topo */
header{position:relative;background:var(--azul);padding:22px 20px 70px;
  clip-path:polygon(0 0,100% 0,100% 72%,88% 80%,86% 76%,63% 91%,60% 86%,34% 97%,31% 91%,0 100%)}
header::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(var(--azul-escuro) 28%,transparent 30%) 0 0/12px 12px;
  -webkit-mask:linear-gradient(110deg,transparent 25%,#000);mask:linear-gradient(110deg,transparent 25%,#000)}
.wrap{max-width:1080px;margin:0 auto;position:relative}
h1{font:400 clamp(46px,10vw,96px)/.95 var(--titulo);letter-spacing:2px;transform:rotate(-4deg);display:inline-block;
  -webkit-text-stroke:8px var(--preto);paint-order:stroke fill;text-shadow:7px 7px 0 var(--preto);overflow-wrap:anywhere}
.sub{font:400 clamp(18px,3vw,26px) var(--tag);background:var(--preto);display:table;padding:4px 16px;margin-top:14px;transform:rotate(-1.5deg)}

nav{display:flex;flex-wrap:wrap;gap:12px;margin:-24px auto 28px;max-width:1080px;padding:0 20px;position:relative}
.btn{font:400 22px var(--titulo);letter-spacing:1.5px;border:0;color:var(--preto);background:var(--branco);padding:8px 22px;
  clip-path:polygon(6% 0,100% 8%,94% 100%,0 90%);transition:transform .15s}
.btn:hover{transform:rotate(-3deg) scale(1.06)}
.btn.ativo,.btn.azul{background:var(--azul);color:var(--branco)}
.btn.preto{background:#000;color:var(--branco)}
.btn.mini{font-size:17px;padding:5px 14px}

main{max-width:1080px;margin:0 auto;padding:0 20px 60px}
.barra{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
input,textarea,select{background:var(--branco);color:var(--preto);border:3px solid #000;box-shadow:4px 4px 0 var(--azul);padding:7px 10px;width:100%}
.barra input{flex:1 1 220px;width:auto}.barra select{width:auto}

/* Cartões */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 26px}
.card{border:0;background:var(--branco);padding:6px;text-align:left;color:var(--branco);transform:rotate(-1.5deg);box-shadow:9px 9px 0 var(--azul);transition:transform .15s,box-shadow .15s}
.card:nth-child(even){transform:rotate(1.5deg)}
.card:hover{transform:rotate(0) translateY(-6px);box-shadow:14px 14px 0 var(--azul-claro)}
.foto{position:relative;aspect-ratio:3/4;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(#000 25%,transparent 27%) 0 0/10px 10px,linear-gradient(150deg,var(--azul) 55%,var(--azul-escuro) 55%)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.semfoto{font:400 120px var(--titulo);-webkit-text-stroke:8px #000;paint-order:stroke fill}
.num{position:absolute;top:6px;right:10px;font:400 52px var(--titulo);-webkit-text-stroke:6px #000;paint-order:stroke fill;transform:rotate(8deg)}
.legenda{background:#000;padding:10px 12px}
.legenda strong{display:block;font:400 30px/1 var(--titulo);letter-spacing:1px;overflow-wrap:anywhere}
.etiqueta{display:inline-block;background:var(--azul);padding:1px 10px;margin-top:6px;transform:skew(-12deg);font-weight:700;text-transform:uppercase}

/* Ficha */
.ficha{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:36px;align-items:start}
.ficha .foto{border:7px solid var(--branco);box-shadow:14px 14px 0 var(--azul);transform:rotate(-2deg)}
.nome{display:flex;flex-wrap:wrap;row-gap:8px;-webkit-text-stroke:0;text-shadow:none;transform:none;margin-bottom:8px}
.palavra{display:inline-flex;flex-wrap:wrap;margin-right:16px}
.letra{font:400 clamp(36px,6vw,62px)/1 var(--titulo);min-width:.7em;text-align:center;text-transform:uppercase;background:#000;border:3px solid var(--branco);padding:6px 7px;margin-left:-2px;transform:rotate(-5deg)}
.letra:nth-child(even){background:var(--branco);color:#000;border-color:#000;transform:rotate(4deg)}
.letra:nth-child(3n){font-size:clamp(32px,5vw,54px);transform:rotate(2deg) translateY(4px)}
.letra:first-child{background:var(--azul);color:var(--branco);border-color:var(--branco)}
.apelido{font:400 26px var(--tag);color:var(--azul-claro);margin:14px 0}
.painel{background:#000;border:5px solid var(--branco);padding:20px 24px;margin:22px 0;
  clip-path:polygon(0 0,100% 6px,calc(100% - 8px) 100%,6px calc(100% - 7px))}
h2{font:400 34px var(--titulo);letter-spacing:1.5px;display:inline-block;background:var(--azul);padding:2px 18px;transform:rotate(-2deg);margin-bottom:12px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.dados{display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.dados dt{color:var(--azul-claro);font-weight:700;text-transform:uppercase}
.dados dd{overflow-wrap:anywhere}
.attr{display:grid;grid-template-columns:minmax(80px,140px) 1fr 40px;gap:12px;align-items:center;margin:7px 0}
.trilho{height:16px;background:#2a2a36;transform:skew(-18deg)}
.trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--azul),var(--azul-claro))}
.hab{border-left:8px solid var(--azul);padding-left:12px;margin:14px 0}
.hab b{font:400 22px var(--tag);color:var(--azul-claro)}
.vazio{font:400 26px var(--tag);text-align:center;padding:50px 10px}
article h2{font-size:38px}

/* Editor */
dialog{margin:auto;width:min(680px,94vw);max-height:92vh;background:var(--preto);color:var(--branco);border:5px solid var(--branco);box-shadow:12px 12px 0 var(--azul);padding:22px}
dialog::backdrop{background:#020617d9}
label{display:block;font-weight:700;text-transform:uppercase;margin:0 0 14px}
label input,label textarea,label select{margin-top:4px;text-transform:none;font-weight:500}
textarea{resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
fieldset{border:3px dashed var(--azul);padding:12px;margin-bottom:18px}
legend{font:400 24px var(--titulo);letter-spacing:1px;padding:0 8px}
.linha{display:grid;gap:10px;margin-bottom:12px;align-items:start}
.linha.at{grid-template-columns:1fr 90px auto}
.linha.hb{grid-template-columns:1fr 2fr auto}
.linha.ex{grid-template-columns:1fr 2fr auto}
.x{background:#000;color:var(--branco);border:3px solid var(--branco);width:42px;height:42px;font-weight:700}
.acoes{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:10px}

footer{background:#000;border-top:6px solid var(--azul);padding:24px 20px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
footer p{flex:1 1 260px}
[hidden]{display:none!important}
/* Jogadores só leem; o modo editor abre com ?editar no fim do link */
body:not(.editor) :is([data-acao=capa],[data-acao=personagem],[data-acao=excluir],[data-acao=pagina],[data-acao=excluirPagina],footer){display:none!important}
@media(max-width:720px){
  .ficha{grid-template-columns:1fr}
  .duas,.linha.hb,.linha.ex{grid-template-columns:1fr}
  .grade{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="titulo"></h1><p class="sub" id="subtitulo"></p></div></header>
<nav id="menu"></nav>
<main id="app"></main>
<footer><div class="wrap">
  <p><b>Modo editor.</b> As mudanças ficam como rascunho neste navegador. Os jogadores só veem depois que você clicar em <b>Publicar</b>.</p>
  <button class="btn azul" data-acao="publicar">Publicar no site</button>
  <button class="btn mini" id="baixar">Baixar wiki</button>
  <button class="btn mini" id="exportar">Salvar backup</button>
  <button class="btn mini" id="importar">Abrir backup</button>
  <input type="file" id="arquivo" accept=".json,application/json" hidden>
</div></footer>
<dialog id="editor"><form id="form"></form></dialog>

<!-- Os dados da wiki ficam aqui. "Baixar wiki" atualiza este bloco automaticamente. -->
<script type="application/json" id="dados-wiki">
{
 "atualizado": 0,
 "titulo": "MINHA WIKI FC",
 "subtitulo": "Futebol de rua, regras próprias",
 "personagens": [
  {"id":"p1","nome":"Zeca Trovão","apelido":"O Raio da Quadra","posicao":"Atacante","numero":"9","time":"Azulão da Vila","foto":"",
   "descricao":"Personagem de exemplo. Clique em Editar para trocar tudo ou em Excluir para apagar.",
   "atributos":[{"nome":"Velocidade","valor":92},{"nome":"Chute","valor":87},{"nome":"Drible","valor":80},{"nome":"Defesa","valor":35}],
   "habilidades":[{"nome":"Chute Relâmpago","desc":"Finalização muito forte de fora da área."}],
   "extras":[{"nome":"Idade","valor":"17"},{"nome":"Pé dominante","valor":"Direito"}]},
  {"id":"p2","nome":"Bia Muralha","apelido":"Paredão","posicao":"Goleira","numero":"1","time":"Azulão da Vila","foto":"",
   "descricao":"Outro exemplo. Lidera a defesa e quase nunca perde a calma.",
   "atributos":[{"nome":"Reflexo","valor":95},{"nome":"Defesa","valor":90},{"nome":"Passe","valor":64}],
   "habilidades":[{"nome":"Mãos de Concreto","desc":"Aumenta a chance de defender pênaltis."}],
   "extras":[{"nome":"Idade","valor":"18"}]}
 ],
 "paginas": [
  {"id":"i1","titulo":"Sobre o jogo","texto":"Escreva aqui a história, as regras, os times, os modos de jogo..."}
 ]
}
</script>

<script>
const $ = s => document.querySelector(s);
const original = JSON.parse($('#dados-wiki').textContent);
const CHAVE = 'wiki-futebol-v1';
const POSICOES = ['Goleiro','Goleira','Zagueiro','Zagueira','Lateral','Volante','Meio-campo','Ponta','Atacante','Técnico','Técnica'];

const EDITOR = new URLSearchParams(location.search).has('editar');
document.body.classList.toggle('editor', EDITOR);
original.base = original.atualizado; // versão publicada em que o rascunho se baseia

let dados = original;
if (EDITOR) try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE));
  if (salvo && salvo.atualizado > original.atualizado) dados = salvo;
} catch (e) {}

let tela = {aba:'personagens', id:null}, busca = '', filtro = '';

const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const limitar = v => Math.max(0, Math.min(100, Number(v) || 0));
const fotoSegura = f => /^data:image\//.test(f || '') ? f : '';

function salvar(){
  dados.atualizado = Date.now();
  try { localStorage.setItem(CHAVE, JSON.stringify(dados)); }
  catch (e) { alert('Não consegui salvar no navegador (memória cheia ou bloqueada). Publique ou clique em "Baixar wiki" agora para não perder as mudanças.'); }
}

function retrato(p){
  const f = fotoSegura(p.foto);
  return `<div class="foto">${f ? `<img src="${esc(f)}" alt="Foto de ${esc(p.nome)}">` : `<span class="semfoto">${esc((p.nome || '?')[0])}</span>`}
    ${p.numero ? `<span class="num">${esc(p.numero)}</span>` : ''}</div>`;
}

function desenhar(){
  document.title = dados.titulo;
  $('#titulo').textContent = dados.titulo;
  $('#subtitulo').textContent = dados.subtitulo;
  $('#menu').innerHTML =
    `<button class="btn ${tela.aba==='personagens'?'ativo':''}" data-acao="aba" data-v="personagens">Personagens</button>
     <button class="btn ${tela.aba==='paginas'?'ativo':''}" data-acao="aba" data-v="paginas">Informações</button>
     <button class="btn preto" data-acao="capa">✎ Editar capa</button>`;
  const p = dados.personagens.find(x => x.id === tela.id);
  if (tela.aba === 'paginas') desenharPaginas();
  else if (p) desenharFicha(p);
  else desenharLista();
}

function desenharLista(){
  const posicoes = [...new Set(dados.personagens.map(p => p.posicao).filter(Boolean))];
  if (!posicoes.includes(filtro)) filtro = '';
  $('#app').innerHTML = `<div class="barra">
    <input id="busca" type="search" placeholder="Buscar nome, time ou habilidade..." aria-label="Buscar" value="${esc(busca)}">
    <select id="filtro" aria-label="Posição"><option value="">Todas as posições</option>
      ${posicoes.map(x => `<option ${x===filtro?'selected':''}>${esc(x)}</option>`).join('')}</select>
    <button class="btn azul" data-acao="personagem">+ Novo personagem</button></div><div id="grade"></div>`;
  desenharGrade();
}

function desenharGrade(){
  const q = busca.toLowerCase();
  const lista = dados.personagens.filter(p => (!filtro || p.posicao === filtro) &&
    [p.nome,p.apelido,p.time,...p.habilidades.map(h => h.nome)].join(' ').toLowerCase().includes(q));
  $('#grade').innerHTML = lista.length ? `<div class="grade">${lista.map(p =>
    `<button class="card" data-acao="ver" data-v="${esc(p.id)}">${retrato(p)}
      <div class="legenda"><strong>${esc(p.nome)}</strong>${p.posicao ? `<span class="etiqueta">${esc(p.posicao)}</span>` : ''}</div></button>`).join('')}</div>`
    : '<p class="vazio">Nenhum personagem encontrado.</p>';
}

// Nome em letras recortadas
const recortar = nome => String(nome).split(/\s+/).map(w =>
  `<span class="palavra" aria-hidden="true">${[...w].map(l => `<span class="letra">${esc(l)}</span>`).join('')}</span>`).join('');

function desenharFicha(p){
  const info = [{nome:'Posição',valor:p.posicao},{nome:'Número',valor:p.numero},{nome:'Time',valor:p.time},...p.extras].filter(i => i.valor);
  $('#app').innerHTML = `<div class="barra">
      <button class="btn" data-acao="aba" data-v="personagens">◀ Voltar</button>
      <button class="btn azul" data-acao="personagem" data-v="${esc(p.id)}">✎ Editar</button>
      <button class="btn preto" data-acao="excluir" data-v="${esc(p.id)}">Excluir</button></div>
    <div class="ficha">${retrato(p)}<div>
      <h1 class="nome" aria-label="${esc(p.nome)}">${recortar(p.nome)}</h1>
      ${p.apelido ? `<p class="apelido">“${esc(p.apelido)}”</p>` : ''}
      ${info.length ? `<section class="painel"><dl class="dados">${info.map(i => `<dt>${esc(i.nome)}</dt><dd>${esc(i.valor)}</dd>`).join('')}</dl></section>` : ''}
      ${p.descricao ? `<section class="painel"><h2>História</h2><p class="pre">${esc(p.descricao)}</p></section>` : ''}
      ${p.atributos.length ? `<section class="painel"><h2>Atributos</h2>${p.atributos.map(a =>
        `<div class="attr"><span>${esc(a.nome)}</span><div class="trilho"><i style="width:${limitar(a.valor)}%"></i></div><b>${limitar(a.valor)}</b></div>`).join('')}</section>` : ''}
      ${p.habilidades.length ? `<section class="painel"><h2>Habilidades</h2>${p.habilidades.map(h =>
        `<div class="hab"><b>${esc(h.nome)}</b><p class="pre">${esc(h.desc)}</p></div>`).join('')}</section>` : ''}
    </div></div>`;
}

function desenharPaginas(){
  $('#app').innerHTML = `<div class="barra"><button class="btn azul" data-acao="pagina">+ Nova informação</button></div>` +
    (dados.paginas.map(i => `<article class="painel"><h2>${esc(i.titulo)}</h2><p class="pre">${esc(i.texto)}</p>
      <div class="acoes"><button class="btn azul mini" data-acao="pagina" data-v="${esc(i.id)}">✎ Editar</button>
      <button class="btn mini" data-acao="excluirPagina" data-v="${esc(i.id)}">Excluir</button></div></article>`).join('')
      || '<p class="vazio">Nenhuma informação ainda.</p>');
}

/* ---------- Editor ---------- */
const campo = (rotulo, nome, valor, extra='') => `<label>${rotulo}<input name="${nome}" value="${esc(valor)}" ${extra}></label>`;
const area = (rotulo, nome, valor) => `<label>${rotulo}<textarea name="${nome}" rows="5">${esc(valor)}</textarea></label>`;
const botoes = `<div class="acoes"><button type="button" class="btn" data-acao="fechar">Cancelar</button><button class="btn azul">Salvar</button></div>`;
let aoSalvar = null, fotoNova = '';

const modelos = {
  atributos: (a={}) => `<div class="linha at"><input data-k="nome" placeholder="Ex.: Chute" aria-label="Atributo" value="${esc(a.nome)}"><input data-k="valor" type="number" min="0" max="100" aria-label="Valor de 0 a 100" value="${esc(a.valor ?? 50)}"><button type="button" class="x" data-acao="tirar" aria-label="Remover">X</button></div>`,
  habilidades: (h={}) => `<div class="linha hb"><input data-k="nome" placeholder="Nome da habilidade" aria-label="Habilidade" value="${esc(h.nome)}"><textarea data-k="desc" rows="2" placeholder="O que ela faz" aria-label="Descrição">${esc(h.desc)}</textarea><button type="button" class="x" data-acao="tirar" aria-label="Remover">X</button></div>`,
  extras: (e={}) => `<div class="linha ex"><input data-k="nome" placeholder="Ex.: Altura" aria-label="Nome do campo" value="${esc(e.nome)}"><input data-k="valor" placeholder="Ex.: 1,75 m" aria-label="Valor" value="${esc(e.valor)}"><button type="button" class="x" data-acao="tirar" aria-label="Remover">X</button></div>`
};
const grupo = (titulo, tipo, itens) => `<fieldset><legend>${titulo}</legend><div id="g-${tipo}">${itens.map(modelos[tipo]).join('')}</div><button type="button" class="btn mini azul" data-acao="mais" data-v="${tipo}">+ Adicionar</button></fieldset>`;
const lerGrupo = tipo => [...document.querySelectorAll(`#g-${tipo} .linha`)]
  .map(l => Object.fromEntries([...l.querySelectorAll('[data-k]')].map(i => [i.dataset.k, i.value.trim()])))
  .filter(o => o.nome);

function abrir(html, funcao, rotulo = 'Salvar'){
  $('#form').innerHTML = html + botoes;
  $('#form .acoes .azul').textContent = rotulo;
  aoSalvar = funcao;
  $('#editor').showModal();
  $('#editor').scrollTop = 0;
}

function editarPersonagem(id){
  const p = dados.personagens.find(x => x.id === id) ||
    {nome:'',apelido:'',posicao:'',numero:'',time:'',foto:'',descricao:'',extras:[],habilidades:[],
     atributos:['Velocidade','Chute','Passe','Drible','Defesa'].map(nome => ({nome,valor:50}))};
  fotoNova = p.foto;
  abrir(`<h2>${id ? 'Editar' : 'Novo'} personagem</h2>
    <div class="duas">${campo('Nome','nome',p.nome,'required')}${campo('Apelido','apelido',p.apelido)}
    ${campo('Posição','posicao',p.posicao,'list="posicoes"')}${campo('Número','numero',p.numero,'maxlength="3" inputmode="numeric"')}</div>
    <datalist id="posicoes">${POSICOES.map(x => `<option value="${x}">`).join('')}</datalist>
    ${campo('Time','time',p.time)}
    <label>Foto<input type="file" id="foto" accept="image/*"></label>
    <p id="status" aria-live="polite"></p>
    <p style="margin-bottom:16px"><button type="button" class="btn mini" data-acao="semFoto">Remover foto</button></p>
    ${area('História / descrição','descricao',p.descricao)}
    ${grupo('Atributos (0 a 100)','atributos',p.atributos)}
    ${grupo('Habilidades','habilidades',p.habilidades)}
    ${grupo('Outras informações','extras',p.extras)}`,
  f => {
    const novo = {id: id || novoId(), foto: fotoNova};
    ['nome','apelido','posicao','numero','time','descricao'].forEach(k => novo[k] = f.get(k).trim());
    ['atributos','habilidades','extras'].forEach(k => novo[k] = lerGrupo(k));
    novo.atributos.forEach(a => a.valor = limitar(a.valor));
    const i = dados.personagens.findIndex(x => x.id === novo.id);
    i < 0 ? dados.personagens.push(novo) : dados.personagens[i] = novo;
    tela = {aba:'personagens', id:novo.id};
  });
}

function editarPagina(id){
  const i = dados.paginas.find(x => x.id === id) || {titulo:'',texto:''};
  abrir(`<h2>Informação</h2>${campo('Título','titulo',i.titulo,'required')}${area('Texto','texto',i.texto)}`, f => {
    const novo = {id: id || novoId(), titulo: f.get('titulo').trim(), texto: f.get('texto')};
    const n = dados.paginas.findIndex(x => x.id === novo.id);
    n < 0 ? dados.paginas.push(novo) : dados.paginas[n] = novo;
  });
}

const acoes = {
  aba: v => { tela = {aba:v, id:null}; desenhar(); },
  ver: v => { tela.id = v; desenhar(); scrollTo(0,0); },
  capa: () => abrir(`<h2>Capa da wiki</h2>${campo('Título','titulo',dados.titulo,'required')}${campo('Subtítulo','subtitulo',dados.subtitulo)}`,
    f => { dados.titulo = f.get('titulo').trim(); dados.subtitulo = f.get('subtitulo').trim(); }),
  publicar: telaPublicar,
  personagem: editarPersonagem,
  pagina: editarPagina,
  excluir: v => { if (!confirm('Excluir este personagem?')) return;
    dados.personagens = dados.personagens.filter(p => p.id !== v); tela.id = null; salvar(); desenhar(); },
  excluirPagina: v => { if (!confirm('Excluir esta informação?')) return;
    dados.paginas = dados.paginas.filter(p => p.id !== v); salvar(); desenhar(); },
  mais: v => $(`#g-${v}`).insertAdjacentHTML('beforeend', modelos[v]()),
  tirar: (v, el) => el.closest('.linha').remove(),
  semFoto: () => { fotoNova = ''; $('#foto').value = ''; $('#status').textContent = 'A foto será removida ao salvar.'; },
  fechar: () => $('#editor').close()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-acao]');
  if (el) acoes[el.dataset.acao](el.dataset.v, el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca') { busca = e.target.value; desenharGrade(); }
});

// Reduz a foto antes de guardar, para a wiki não ficar pesada
document.addEventListener('change', e => {
  if (e.target.id === 'filtro') { filtro = e.target.value; desenharGrade(); }
  if (e.target.id !== 'foto' || !e.target.files[0]) return;
  const url = URL.createObjectURL(e.target.files[0]), img = new Image();
  const salvarBtn = $('#form .acoes .azul');
  salvarBtn.disabled = true;
  img.onload = () => {
    const k = Math.min(1, 800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    fotoNova = c.toDataURL('image/webp', .82);
    if (!fotoNova.startsWith('data:image/webp')) { // navegadores sem WebP
      const x = c.getContext('2d'); x.globalCompositeOperation = 'destination-over';
      x.fillStyle = '#06237a'; x.fillRect(0, 0, c.width, c.height);
      fotoNova = c.toDataURL('image/jpeg', .85);
    }
    URL.revokeObjectURL(url);
    salvarBtn.disabled = false;
    $('#status').textContent = 'Foto pronta!';
  };
  img.onerror = () => { salvarBtn.disabled = false; $('#status').textContent = 'Não consegui ler essa imagem. Tente JPG ou PNG.'; };
  img.src = url;
});

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  if (aoSalvar === publicar) return publicar(new FormData(e.target));
  aoSalvar(new FormData(e.target));
  $('#editor').close();
  salvar(); desenhar();
});

/* ---------- Baixar / backup ---------- */
function download(nome, conteudo, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], {type:tipo}));
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const json = () => JSON.stringify(dados, null, 1).replace(/</g, '\\u003c');

// Gera o HTML completo da wiki com os dados atuais
function gerarHTML(){
  const copia = document.documentElement.cloneNode(true);
  ['#titulo','#subtitulo','#menu','#app','#form'].forEach(s => copia.querySelector(s).innerHTML = '');
  copia.querySelector('#editor').removeAttribute('open');
  copia.querySelector('body').removeAttribute('class');
  copia.querySelector('#dados-wiki').textContent = '\n' + json() + '\n';
  return '<!DOCTYPE html>\n' + copia.outerHTML;
}
$('#baixar').onclick = () => download('index.html', gerarHTML(), 'text/html');

/* ---------- Publicar no GitHub ---------- */
const ler = (area, k) => { try { return window[area].getItem(k) || ''; } catch (e) { return ''; } };
const gravar = (area, k, v) => { try { v ? window[area].setItem(k, v) : window[area].removeItem(k); } catch (e) {} };

function telaPublicar(){
  // No GitHub Pages o endereço é usuario.github.io/repositorio
  const noPages = location.hostname.endsWith('.github.io');
  const dono = ler('localStorage','gh-dono') || (noPages ? location.hostname.split('.')[0] : '');
  const pasta = location.pathname.split('/')[1];
  const repo = ler('localStorage','gh-repo') || (noPages ? (pasta && !pasta.includes('.') ? pasta : location.hostname) : '');
  const lembrado = ler('localStorage','gh-token');
  abrir(`<h2>Publicar no site</h2>
    ${campo('Seu usuário do GitHub','dono',dono,'required autocomplete="off"')}
    ${campo('Nome do repositório','repo',repo,'required autocomplete="off"')}
    ${campo('Token do GitHub (nunca envie a ninguém)','token',lembrado || ler('sessionStorage','gh-token'),'type="password" required autocomplete="off"')}
    <label><input type="checkbox" name="lembrar" style="width:auto;box-shadow:none" ${lembrado?'checked':''}> Lembrar o token neste aparelho (só no seu computador)</label>
    <p id="status" aria-live="polite"></p>`, publicar, 'Publicar');
}

function base64(texto){
  const bytes = new TextEncoder().encode(texto);
  let s = '';
  for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode(...bytes.subarray(i, i + 32768));
  return btoa(s);
}

async function publicar(f){
  const [dono, repo, token] = ['dono','repo','token'].map(k => f.get(k).trim());
  const botao = $('#form .acoes .azul'), status = t => $('#status').textContent = t;
  const url = `https://api.github.com/repos/${encodeURIComponent(dono)}/${encodeURIComponent(repo)}/contents/index.html`;
  const pedir = (opcoes = {}, tipo = 'application/vnd.github+json') =>
    fetch(url, {cache:'no-store', ...opcoes, headers:{Authorization:`Bearer ${token}`, Accept:tipo}});
  const erro = r => new Error({401:'Token inválido ou vencido.',403:'O token não tem permissão de escrita (Contents: Read and write).',
    404:'Não achei o repositório ou o index.html. Confira os nomes e o acesso do token.',409:'O site mudou durante o envio. Tente de novo.'}[r.status] || `O GitHub respondeu com erro ${r.status}.`);
  botao.disabled = true; status('Publicando...');
  try {
    const info = await pedir();
    if (!info.ok) throw erro(info);
    const {sha} = await info.json();
    const atual = await pedir({}, 'application/vnd.github.raw+json');
    if (!atual.ok) throw erro(atual);
    const bloco = new DOMParser().parseFromString(await atual.text(), 'text/html').querySelector('#dados-wiki');
    const noSite = bloco ? JSON.parse(bloco.textContent).atualizado : 0;
    if (noSite > (dados.base || 0) && !confirm('O site tem uma versão mais nova, publicada de outro lugar. Substituir mesmo assim?')) { status('Publicação cancelada.'); return; }
    const anterior = {atualizado: dados.atualizado, base: dados.base};
    dados.atualizado = dados.base = Date.now();
    const r = await pedir({method:'PUT', body: JSON.stringify({message:'Atualiza a wiki', content: base64(gerarHTML()), sha})});
    if (!r.ok) { Object.assign(dados, anterior); throw erro(r); }
    try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch (e) {}
    gravar('localStorage','gh-dono',dono); gravar('localStorage','gh-repo',repo);
    gravar('sessionStorage','gh-token',token); gravar('localStorage','gh-token', f.get('lembrar') ? token : '');
    status('Publicado! O site atualiza em alguns minutos.');
  } catch (e) {
    status(e instanceof TypeError ? 'Sem conexão com o GitHub. Verifique a internet.' : e.message);
  } finally { botao.disabled = false; }
}
$('#exportar').onclick = () => download('backup-wiki.json', json(), 'application/json');
$('#importar').onclick = () => $('#arquivo').click();
$('#arquivo').onchange = async e => {
  const arq = e.target.files[0];
  if (!arq) return;
  try {
    const d = JSON.parse(await arq.text());
    if (!Array.isArray(d.personagens) || !Array.isArray(d.paginas)) throw 0;
    d.personagens.forEach(p => ['atributos','habilidades','extras'].forEach(k => p[k] = p[k] || []));
    if (!confirm('Substituir a wiki atual por este backup?')) return;
    dados = d; tela = {aba:'personagens', id:null}; salvar(); desenhar();
  } catch (err) { alert('Esse arquivo não é um backup válido da wiki.'); }
  finally { e.target.value = ''; }
};

desenhar();
</script>
